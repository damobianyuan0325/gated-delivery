name: Skills validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skills-${{ github.ref }}
  cancel-in-progress: true
jobs:
  skill-checks:
    name: Skill checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved2026-10-28
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, resolved2026-10-28
        with:
          python-version: '3.12'
      - name: Check skill structure and publication scope
        run: python3 scripts/check_repo.py --tracked --public
      - name: Verify delivery and installation invariants
        run: python3 -m unittest discover -s tests -v
